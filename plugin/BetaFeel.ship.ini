[BetaFeel]
; Smoothing. MVS Patcher has one Smoothing switch that sets all five together; it takes effect at once in a
; running game. 1 = on. Fighters: fighters and projectiles drawn between their 60 Hz sim positions; Camera: the
; camera too; Poses: skeleton poses; Effects: hit sparks, rings, trails; Others: summons and props (Aquaman's dolphin).
Fighters=1
Camera=1
Poses=1
Effects=1
Others=1
; 1 = Hotkey switches smoothing on/off in game too (Windows virtual-key code; 0x77 = F8)
Hotkeys=0
Hotkey=0x77
; Frame rate cap, in drawn frames a second: 0 = none (the game's Vertical Sync and settings decide; best on most
; screens), or 120 / 180 / 240 = 2, 3 or 4 pictures for each of the game's 60 steps a second. A cap below the screen's
; refresh rate only looks even on a G-Sync / FreeSync screen. MVS Patcher sets this; it takes effect at once.
FrameCap=0
; 1 = fast start: the intro (epilepsy warning, logos) and the "Enter MultiVerse!" title are skipped and the game
; goes straight to the main menu. Read when the game starts. A first start's EULA is never skipped.
FastStart=1
; Lab tools: 1 = hitboxes (the game's own collider view: red hit, blue hurt). MVS Patcher sets this.
Lab=0
; 1 = a short system sound on each hotkey press
Beep=0
; read when the game starts: 1 = also hook the engine's own skeletal mesh class (one per fighter, stage props)
EngineMeshes=1
; a move longer than this in one sim step (cm) is shown at once instead of smoothed (respawns, teleports)
FighterSnap=400
; a bone that moves further than this in one sim step (cm) is shown at once
PoseSnap=120
; the root turning further than this in one step is shown at once (70 = about 90 degrees)
PoseSnapTurnPercent=70
; a cut to another pose is shown at once: when more than PoseTurnSharePercent of the bones turn further than
; PoseTurnDegrees in one sim step
PoseTurnDegrees=60
PoseTurnSharePercent=25
; 1 = bones the engine itself moves on every drawn frame (a few loose bones on some fighters, the Joker among them)
; keep that movement on top of the blend; 0 = any pose change between two sim steps shows the whole pose at once (how
; it was before; such fighters then get next to no pose smoothing)
PoseLiveBones=1
; 1 = write BetaFeel.log beside the plugin
Log=1
